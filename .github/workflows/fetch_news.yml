name: Fetch & Score AI News

on:
  schedule:
    # Run every 6 hours (UTC): 00:00, 06:00, 12:00, 18:00
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit live_news.db back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser google-generativeai python-dotenv

      - name: Run RSS fetcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rss_fetcher.py --max-new 40

      - name: Commit updated live_news.db
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_news.db
          git diff --staged --quiet || git commit -m "chore: update live_news.db [skip ci]"
          git push
